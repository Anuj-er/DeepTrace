# DeepTrace — Render.com Deployment Blueprint
# Deploy with: https://render.com/deploy?repo=https://github.com/Anuj-er/DeepTrace

services:
  # Backend — FastAPI Python web service
  - type: web
    name: deeptrace-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Auto-generate a secure random string
      - key: CLOUDINARY_URL
        sync: false  # Set manually in Render dashboard
      - key: DEEPTRACE_MODEL
        value: dima806/deepfake_vs_real_image_detection
      - key: CORS_ORIGINS
        value: https://deeptrace-jha3.onrender.com,http://localhost:5173
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /api/health
    plan: free

  # Frontend — Static site (Vite build)
  - type: web
    name: deeptrace
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://deeptrace-api.onrender.com
